<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Artikel-Abenteuer – Der, die, das und ein, eine: ein Lernspiel für die Grundschule von Förderfreude.">
<title>Artikel-Abenteuer – Der, die, das • ein &amp; eine</title>
<style>
:root{
  --cream:#fbf3e4; --paper:#fffaf0; --ink:#3a3226; --ink2:#5b4f3d; --line:#d9c9a8;
  --terra:#d97e55; --terraD:#b45e39; --sage:#8fa888; --sageD:#5d7a57; --petrol:#8fb9c9; --petrolD:#3f6f84;
  --mustard:#eec14a; --mustardD:#b8892a; --rose:#d98a92; --roseD:#a95560; --focus:#1f5f7a;
  --radius:18px;
  --pic:min(46dvh,40vw,360px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background-color:var(--cream);background-image:radial-gradient(circle at 12% 8%,#fff7e6 0,transparent 45%),radial-gradient(circle at 88% 92%,#f6e8cc 0,transparent 50%);background-attachment:fixed;color:var(--ink);font-family:"Trebuchet MS","Segoe UI","Nunito",system-ui,-apple-system,Roboto,sans-serif;font-size:18px;line-height:1.3;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 7px #fff}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;width:100%}
svg{display:block}

/* ---------- Skins: neutrale Farbvarianten, NIE an einen Artikel gebunden ---------- */
.sk0{--bg:#f6d9c9;--bd:#b45e39}
.sk1{--bg:#dbe7d6;--bd:#5d7a57}
.sk2{--bg:#d4e7ee;--bd:#3f6f84}
.sk3{--bg:#f6e6b0;--bd:#a07a1f}
.sk4{--bg:#f1d3d6;--bd:#a95560}

/* ---------- Startseite ---------- */
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 4px}
.banner{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.9}
.banner svg{width:100%;height:100%}
.title-block{position:relative;z-index:1}
h1{margin:0;font-size:clamp(1.5rem,4.6vw + .4rem,2.8rem);letter-spacing:.04em;line-height:1.05;color:var(--terraD);text-shadow:0 2px 0 #fff}
.sub{margin:2px 0 0;font-size:clamp(1rem,2vw + .5rem,1.5rem);font-weight:700;color:var(--ink2)}
.lead{margin:6px 16px 8px;font-size:clamp(1rem,1.6vw + .5rem,1.4rem);font-weight:700}
.icon-btn{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;border:3px solid var(--terraD);background:var(--paper);display:grid;place-items:center;flex:none;padding:0;color:var(--terraD)}
.icon-btn svg{width:28px;height:28px}
.icon-btn[aria-pressed="false"]{background:#efe6d3;color:#7b6f5b;border-color:#9a8d76}
.icon-btn .slash{display:none}
.icon-btn[aria-pressed="false"] .slash{display:block}
.mode-grid{display:grid;gap:clamp(8px,1.4vw,16px);padding:4px 16px 20px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.mode-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mode-card{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;min-height:96px;border:3px solid var(--bd);border-radius:var(--radius);background:var(--bg);box-shadow:0 4px 0 rgba(90,70,40,.18)}
.mode-card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(90,70,40,.18)}
.mc-art{width:clamp(56px,9vw,92px);height:clamp(56px,9vw,92px);flex:none;background:rgba(255,255,255,.65);border-radius:14px;padding:4px}
.mc-art svg{width:100%;height:100%}
.mc-txt{min-width:0}
.mc-title{display:block;font-weight:800;font-size:clamp(1.02rem,1.2vw + .75rem,1.45rem);line-height:1.12}
.mc-place{display:block;margin-top:3px;font-size:clamp(.85rem,.6vw + .65rem,1.05rem);color:var(--ink2)}
@media (max-width:639px){.mode-card{flex-direction:column;text-align:center;justify-content:center;padding:10px 8px}}
@media (max-height:620px) and (min-width:760px){
  .top{padding-top:8px}.lead{margin:2px 16px 4px}.mode-card{min-height:84px}.mode-grid{padding-bottom:10px}
}

.start-foot{margin-top:auto;flex:1 1 0;min-height:0;max-height:140px;pointer-events:none;overflow:hidden}
.start-foot svg{width:100%;height:100%}
@media (max-height:480px){.start-foot{display:none}}
/* ---------- Auswahl (Stufe) ---------- */
.sub-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 16px 24px;gap:12px}
.sub-head{display:flex;align-items:center;gap:12px}
.btn-small{min-height:48px;padding:6px 16px;border-radius:999px;border:3px solid var(--terraD);background:var(--paper);font-weight:800;font-size:1rem;color:var(--ink)}
.sub-title{margin:0;font-size:clamp(1.3rem,2.6vw + .6rem,2.2rem);color:var(--terraD)}
.sub-hint{margin:0;font-size:clamp(1rem,1.4vw + .5rem,1.3rem);font-weight:700}
.level-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.level-grid{grid-template-columns:repeat(3,1fr)}}
.level-card{display:flex;align-items:center;gap:14px;min-height:92px;padding:12px 16px;border-radius:var(--radius);border:3px solid var(--bd);background:var(--bg);text-align:left;box-shadow:0 4px 0 rgba(90,70,40,.18)}
.level-card:active{transform:translateY(2px)}
.lv-icons{display:flex;gap:4px;flex:none}
.lv-icons svg{width:30px;height:30px}
.lv-name{font-weight:800;font-size:1.5rem;display:block}
.lv-desc{display:block;font-size:1rem;color:var(--ink2)}
@media (min-width:700px){.level-card{flex-direction:column;justify-content:center;text-align:center;min-height:150px}}

/* ---------- Spielbildschirm ---------- */
#screen-game{height:100vh;height:100dvh;max-height:none}
.gbar{display:flex;align-items:center;gap:10px;padding:5px 12px 2px;min-height:50px}
.gbar .btn-small{min-height:44px;padding:4px 14px;font-size:.95rem}
.g-title{flex:1;min-width:0;text-align:center;font-weight:800;font-size:clamp(.95rem,1.2vw + .6rem,1.35rem);line-height:1.1}
.g-title small{display:block;font-weight:700;color:var(--ink2);font-size:.78em}
.gbar .icon-btn{width:46px;height:46px}
.mapstrip{position:relative;height:clamp(46px,9dvh,78px);margin:2px 12px 0;border-radius:14px;background:linear-gradient(#f6ead0,#efdfbc);border:2px solid var(--line);overflow:hidden;flex:none}
.mapstrip>svg{position:absolute;inset:0}
.mk{transition:transform .7s ease-in-out}
.stage{flex:1;min-height:0;display:grid;gap:10px;padding:8px 12px 10px;grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;align-content:start;overflow-y:auto;overflow-x:hidden}
@media (min-aspect-ratio:11/10){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-content:stretch}
}
.pane{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0}
@media (min-aspect-ratio:11/10){.pane{min-height:0}}
.picbox{position:relative;width:var(--pic);height:var(--pic);background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 rgba(90,70,40,.14);padding:10px;display:grid;place-items:center}
@media (max-aspect-ratio:10999/10000){:root{--pic:min(26dvh,56vw,300px)}}
.picbox .art{width:100%;height:100%}
.picbox.blank{background:repeating-linear-gradient(45deg,#f3e8d0 0 12px,#fbf3e4 12px 24px)}
.picbox .q{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--pic)*.5);font-weight:800;color:#c5b793}
.picrow{display:flex;align-items:center;gap:12px}
.spk{width:56px;height:56px;border-radius:50%;border:3px solid var(--petrolD);background:#e3f0f5;display:grid;place-items:center;padding:0;color:var(--petrolD);flex:none}
.spk svg{width:30px;height:30px}
.wordtag{font-weight:800;font-size:clamp(1.4rem,3.2dvh + .6rem,2.4rem);letter-spacing:.01em;min-height:1.2em}
.prompt{margin:0;font-weight:800;text-align:center;font-size:clamp(1.05rem,2.4dvh + .55rem,1.6rem)}
.opts{display:grid;gap:clamp(8px,1.6vw,14px);width:100%;max-width:560px}
.opts.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:clamp(56px,10dvh,92px);border-radius:var(--radius);border:4px solid var(--bd);background:var(--bg);font-weight:800;font-size:clamp(1.5rem,4.4dvh + .5rem,2.5rem);letter-spacing:.03em;text-transform:uppercase;box-shadow:0 5px 0 rgba(90,70,40,.2);padding:4px 6px}
.opt:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(90,70,40,.2)}
.opt.good{background:#cfe6c8;border-color:#3f7a3a;box-shadow:0 0 0 5px rgba(63,122,58,.25)}
.opt.dim,.pcard.dim,.mcard.dim,.tile.dim{opacity:.45}
.opt[disabled]{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(1rem,2dvh + .5rem,1.35rem);padding:2px 8px;border-radius:12px;max-width:560px}
.fb.show{background:#f3e8d0}
.fb.good{background:#dcecd5;color:#2e5a2a}
.combo{display:flex;flex-direction:column;align-items:center;gap:0;font-weight:800;font-size:clamp(1.4rem,4dvh + .4rem,2.8rem);letter-spacing:.03em;text-transform:uppercase;min-height:1.2em;line-height:1.1}
.combo .ln{display:flex;align-items:center;gap:10px}
.combo .arr{font-size:.7em;color:var(--terraD);line-height:1}
.combo.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.nextbtn{min-height:52px;padding:6px 28px;border-radius:999px;border:4px solid var(--sageD);background:#dbe7d6;font-weight:800;font-size:1.25rem;box-shadow:0 4px 0 rgba(90,70,40,.2)}
.sentence{font-weight:800;text-align:center;font-size:clamp(1.35rem,4dvh + .6rem,2.3rem);line-height:1.35}
.gap{display:inline-block;min-width:3.1em;border-bottom:5px solid var(--terraD);margin:0 .1em;text-align:center;color:var(--terraD)}
.gap.filled{border-bottom-color:#3f7a3a;color:#2e5a2a}
.defcard{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:10px 16px;box-shadow:0 5px 0 rgba(90,70,40,.14);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:clamp(1.3rem,4dvh + .4rem,2.8rem);text-transform:uppercase;width:min(100%,var(--pic));text-align:center}
.defcard .arr{font-size:.65em;color:var(--terraD);line-height:1}
.defcard .blank{border-bottom:5px solid var(--terraD);display:inline-block;min-width:2.4em}

/* Blöcke für Rucksack & Brücke */
.blk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0}
@media (min-aspect-ratio:11/10){.blk{min-height:0}}
.stage.k-pack{grid-template-areas:"tray" "bags" "foot"}
.stage.k-match{grid-template-areas:"head" "cols" "foot"}
.a-tray{grid-area:tray}.a-bags{grid-area:bags}.a-head{grid-area:head}.a-cols{grid-area:cols}.a-foot{grid-area:foot}
@media (min-aspect-ratio:11/10){
  .stage.k-pack{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"tray bags" "foot bags"}
  .stage.k-match{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"head cols" "foot cols"}
}
.stage.solved .prompt{display:none}
.stage.solved.k-pack .a-tray{display:none}
/* Rucksack packen */
.tray{display:grid;gap:clamp(8px,1.6dvh,16px);width:100%;justify-content:center;grid-template-columns:repeat(3,minmax(0,var(--cw)))}
.pane-pack{--cw:clamp(86px,28vw,170px);--ca:clamp(40px,13dvh,112px)}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 4px;border-radius:16px;border:3px solid var(--line);background:var(--paper);box-shadow:0 4px 0 rgba(90,70,40,.14);touch-action:none;user-select:none;-webkit-user-select:none}
.pcard .art{width:var(--ca);height:var(--ca)}
.pcard .w{font-weight:800;font-size:clamp(.85rem,1.9dvh + .3rem,1.2rem);min-height:1.15em}
.pcard.sel{border-color:var(--focus);background:#e7f3f8;box-shadow:0 0 0 5px rgba(31,95,122,.3)}
.pcard.drag-src{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:rotate(-3deg) scale(1.05);box-shadow:0 10px 22px rgba(0,0,0,.28)}
.bags{display:grid;gap:8px;width:100%;max-width:560px;grid-template-columns:1fr}
@media (max-aspect-ratio:10999/10000){.bags{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bag{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;min-height:clamp(56px,15dvh,130px);padding:6px 10px 6px 10px;border-radius:22px 22px 14px 14px;border:4px solid var(--bd);background:var(--bg);text-align:left;box-shadow:0 5px 0 rgba(90,70,40,.2)}
.bag::before{content:"";position:absolute;left:14px;right:14px;top:-10px;height:14px;border-radius:12px 12px 0 0;border:4px solid var(--bd);border-bottom:0;background:var(--bg)}
.bag.over{outline:5px dashed var(--focus);outline-offset:3px}
.bag-lab{background:var(--paper);border:3px solid var(--bd);border-radius:12px;padding:4px 10px;font-weight:800;font-size:clamp(1.3rem,3.6dvh + .4rem,2.1rem);letter-spacing:.03em;text-transform:uppercase}
.bag-in{display:flex;flex-wrap:wrap;gap:4px;align-content:center;min-height:40px}
.mini{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.85);border-radius:10px;padding:2px 4px;font-weight:800;font-size:clamp(.82rem,1.6dvh + .3rem,1.05rem);text-transform:uppercase;line-height:1.05}
.mini svg{width:clamp(28px,6dvh,50px);height:clamp(28px,6dvh,50px)}
@media (max-aspect-ratio:10999/10000){
  .bag{grid-template-columns:1fr;justify-items:center;text-align:center;min-height:clamp(86px,18dvh,150px);align-content:start}
  .bag-in{justify-content:center}
}

/* Zusammenpassen: Brücke */
.bridge{display:flex;justify-content:center;gap:4px;margin:2px auto 0;padding:4px 10px;border-radius:12px;background:linear-gradient(#e3f0f5,#d4e7ee);border:2px solid var(--petrol)}
.plank{width:clamp(30px,6vw,56px);height:clamp(16px,3dvh,24px);border-radius:5px;border:3px dashed #b9a98a;background:transparent}
.plank.on{border:3px solid #7a5a3a;background:#c99a6c}
.mcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:10px;width:100%;max-width:560px;align-items:center}
.mcol{display:flex;flex-direction:column;gap:clamp(5px,1.1dvh,10px)}
.mcard{display:flex;align-items:center;gap:8px;min-height:clamp(48px,9.4dvh,84px);padding:3px 8px;border-radius:14px;border:3px solid var(--line);background:var(--paper);box-shadow:0 3px 0 rgba(90,70,40,.14);text-align:left}
.mcard .art{width:clamp(38px,8dvh,72px);height:clamp(38px,8dvh,72px);flex:none}
.mcard .w{font-weight:800;font-size:clamp(1rem,2.4dvh + .35rem,1.6rem);min-width:0;overflow-wrap:anywhere}
.mcard.sel{border-color:var(--focus);background:#e7f3f8;box-shadow:0 0 0 5px rgba(31,95,122,.3)}
.mcard.done{border-color:#3f7a3a;background:#dcecd5}
.mcard .ph{font-weight:800;text-transform:uppercase;font-size:clamp(1rem,2.4dvh + .35rem,1.6rem)}
.tile{min-height:clamp(48px,9.4dvh,84px);border-radius:14px;border:4px solid var(--bd);background:var(--bg);font-weight:800;font-size:clamp(1.3rem,3.4dvh + .4rem,2.2rem);text-transform:uppercase;box-shadow:0 4px 0 rgba(90,70,40,.2)}
.tile.used{opacity:.4;border-style:dashed;box-shadow:none}

/* Kulisse */
.scenery{position:absolute;left:0;right:0;bottom:0;height:clamp(46px,13dvh,120px);pointer-events:none;z-index:0;overflow:hidden}
.scenery svg{position:absolute;bottom:0;width:100%;height:100%}
#screen-game{position:relative}
#screen-game>*:not(.scenery):not(.sr){position:relative;z-index:1}
@media (max-height:520px){.scenery{display:none}}
/* Ende */
.end-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 16px 20px;text-align:center}
#end-art{width:min(92vw,520px)}
#end-art svg{width:100%;height:auto;max-height:44dvh}
.end-title{margin:0;font-size:clamp(1.7rem,4.5vw + .6rem,3rem);color:var(--terraD)}
.end-sub{margin:0;font-weight:700;font-size:clamp(1rem,1.6vw + .5rem,1.4rem)}
.end-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.end-btns .nextbtn{min-width:210px}
.end-btns .btn2{border-color:var(--terraD);background:var(--paper)}
.sparkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sparkle:nth-child(2n){animation-delay:.6s}.sparkle:nth-child(3n){animation-delay:1.1s}
@keyframes tw{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.hop{animation:hop 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* kurze Bildschirme */
@media (max-height:480px){
  .top{padding:6px 16px 0}h1{font-size:1.5rem}.sub{font-size:1rem}.lead{margin:2px 16px 4px;font-size:1rem}
  .mode-card{min-height:76px;padding:6px 10px}.mc-art{width:54px;height:54px}.mode-grid{padding-bottom:10px;gap:8px}
  .combo{font-size:clamp(1.3rem,3.4dvh + .3rem,2rem)}.sentence{font-size:1.3rem}
  .gbar{min-height:46px;padding-top:2px;padding-bottom:0}.g-title small{display:none}
  .spk{width:48px;height:48px}.opt{min-height:50px}.nextbtn{min-height:44px;font-size:1.1rem}
  .fb{min-height:1.7em}.stage{padding:4px 12px 6px;gap:6px}.mapstrip{height:40px}
  .a-tray .prompt{display:none}.blk{gap:5px}.mini{font-size:.74rem}.mini svg{width:26px;height:26px}.bag{padding:4px 8px}
  .nextbtn{padding:4px 22px}
}
@media (max-aspect-ratio:10999/10000){ .stage.k-sent{--pic:min(19dvh,42vw,230px)} .stage.k-sent .combo{font-size:clamp(1.3rem,3.2dvh + .4rem,2.2rem)} }
@media (max-aspect-ratio:10999/10000) and (max-height:700px){ .stage.k-sent{--pic:min(15dvh,36vw,170px)} .stage.k-sent .sentence{font-size:clamp(1.2rem,3.2dvh + .3rem,1.7rem)} .stage.k-sent .prompt{font-size:1rem} .stage.k-missing.solved .combo{display:none} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app">
<section id="screen-start" class="screen" aria-labelledby="h1">
  <header class="top">
    <div class="banner" id="banner" aria-hidden="true"></div>
    <div class="title-block"><h1 id="h1">ARTIKEL-ABENTEUER</h1><p class="sub">Der, die, das • ein &amp; eine</p></div>
    <button id="btn-sound" class="icon-btn" aria-pressed="true" aria-label="Sprachausgabe ist an. Zum Ausschalten drücken."></button>
  </header>
  <p class="lead">Such dir dein Abenteuer aus!</p>
  <div id="mode-grid" class="mode-grid"></div>
  <div id="start-foot" class="start-foot" aria-hidden="true"></div>
</section>

<section id="screen-sub" class="screen" hidden aria-labelledby="sub-title">
  <div class="sub-wrap">
    <div class="sub-head"><button id="sub-back" class="btn-small">← Zurück</button><h2 id="sub-title" class="sub-title"></h2></div>
    <p id="sub-hint" class="sub-hint"></p>
    <div id="sub-choices" class="level-grid"></div>
  </div>
</section>

<section id="screen-game" class="screen" hidden aria-label="Spiel">
  <div class="gbar">

/* ===== Zufall & Hilfsfunktionen ===== */
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
const ROUND_TARGET = 8;
const SKINS = ['sk0','sk1','sk2','sk3','sk4'];          // neutrale Farbvarianten – nie an einen Artikel gebunden
const GENDERS = ['m','f','n'];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

/* ===== Wortpools je Stufe ===== */
function poolFor(level){
  const ds = level==='leicht' ? ['e'] : level==='mittel' ? ['e','m'] : ['m','h'];
  return WORDS.filter(w=>ds.includes(w.d));
}

/* ===== Rundenzustand: sorgt für Abwechslung innerhalb einer Runde ===== */
function newRoundState(){
  return { used:new Set(), lastTask:new Set(), recentCats:[], repeats:0, pc3:[0,0,0], pc2:[0,0], last3:[], last2:[],
           einCount:{f:0,mn:0,m:0,n:0}, indefTasks:0, usedPre:[], gq:[], catCount:{} };
}
function pickWord(R, pool, g, taken, filter){
  let c = pool.filter(w=>(!g||w.g===g) && (!filter||filter(w)) && !taken.some(t=>t.id===w.id || (w.group && t.group===w.group)));
  let fresh = c.filter(w=>!R.used.has(w.id));
  if(!fresh.length){ R.repeats++; fresh = c.filter(w=>!R.lastTask.has(w.id)); if(!fresh.length) fresh = c; }
  const better = fresh.filter(w=>!R.recentCats.includes(w.category));
  if(better.length) fresh = better;
  const cc = w=>R.catCount[w.category]||0, minC = Math.min(...fresh.map(cc));
  fresh = fresh.filter(w=>cc(w)===minC);
  const w = pick(fresh);
  R.used.add(w.id); R.catCount[w.category]=cc(w)+1; R.recentCats.push(w.category); if(R.recentCats.length>2) R.recentCats.shift();
  return w;
}
function endTask(R, words){ R.lastTask = new Set(words.map(w=>w.id)); }
function remainingByGender(R, pool){ const r={m:0,f:0,n:0}; pool.forEach(w=>{ if(!R.used.has(w.id)) r[w.g]++; }); return r; }
/* Genusverteilung für eine Aufgabe mit n Wörtern: je 1 pro Genus, Rest nach Vorrat (max. 3 je Genus) */
function genderMix(R, pool, n, needEach=true){
  const out = needEach ? GENDERS.slice() : [];
  const cnt = {m:0,f:0,n:0}; out.forEach(g=>cnt[g]++);
  while(out.length<n){
    const rem = remainingByGender(R,pool);
    const cand = GENDERS.filter(g=>cnt[g]<3).map(g=>({g, free:rem[g]-cnt[g]+Math.random()*0.9}));
    cand.sort((a,b)=>b.free-a.free);
    out.push(cand[0].g); cnt[cand[0].g]++;
  }
  return shuffle(out);
}

/* ===== Antwortpositionen: gleichmäßig verteilt, nie 3× dieselbe Stelle hintereinander ===== */
function layoutOptions(R, arts, correct){
  const n = arts.length, cnt = n===3 ? R.pc3 : R.pc2, last = n===3 ? R.last3 : R.last2;
  const min = Math.min(...cnt);
  let cands = [...Array(n).keys()].filter(i=>cnt[i]===min);
  const nr = cands.filter(i=>!(last.length>=1 && last[last.length-1]===i));
  if(nr.length) cands = nr;
  const p = pick(cands);
  cnt[p]++; last.push(p);
  const others = shuffle(arts.filter(a=>a!==correct));
  const order = []; let oi=0;
  for(let i=0;i<n;i++) order.push(i===p ? correct : others[oi++]);
  const skins = shuffle(SKINS).slice(0,n);
  return order.map((art,i)=>({ art, skin:skins[i] }));
}

/* ===== Satzvorlagen (nur Nominativ, nur Subjekt/Existenz – keine Akkusativ-/Dativ-Konstruktionen) ===== */
function templatesFor(w){
  const N = w.word, specific = [], general = [];
  w.acts.forEach(v=>specific.push({ pre:'', post:`${N} ${v}.`, type:'act' }));
  if(w.pos==='s'){ specific.push({ pre:'Hier steht', post:`${N}.`, type:'pos' }); specific.push({ pre:'Dort steht', post:`${N}.`, type:'pos' }); }
  if(w.pos==='l'){ specific.push({ pre:'Hier liegt', post:`${N}.`, type:'pos' }); specific.push({ pre:'Dort liegt', post:`${N}.`, type:'pos' }); }
  general.push({ pre:'Hier ist', post:`${N}.`, type:'ist' }); general.push({ pre:'Dort ist', post:`${N}.`, type:'ist' }); general.push({ pre:'', post:`${N} ist da.`, type:'da' });
  return { specific, general };
}
function chooseTemplate(R, w){
  const t = templatesFor(w);
  let list = (t.specific.length && Math.random()<0.8) ? t.specific : t.general;
  const fresh = list.filter(x=>!R.usedPre.includes(x.pre+'|'+x.type));
  if(fresh.length) list = fresh;
  const x = pick(list); R.usedPre.push(x.pre+'|'+x.type); if(R.usedPre.length>3) R.usedPre.shift();
  return x;
}
function sentenceText(tpl, article){ return tpl.pre ? `${tpl.pre} ${article} ${tpl.post}` : `${cap(article)} ${tpl.post}`; }
/* Welche Artikel passen in den Satz? (Nominativ-Kongruenz – unabhängig von der Wortliste geprüft) */
const FITS = { der:['masculine'], die:['feminine'], das:['neuter'], ein:['masculine','neuter'], eine:['feminine'] };
function fittingOptions(w, optionArts){ return optionArts.filter(a=>FITS[a].includes(w.gender)); }

/* ===== Aufgabenplaner ===== */
function planFork(R, level, g){
  const w = pickWord(R, poolFor(level), g, []);
  endTask(R,[w]);
  return { kind:'fork', set:'def', ids:[w.id], options:layoutOptions(R, ['der','die','das'], w.definiteArticle) };
}
function planPack(R, level){
  const pool = poolFor(level);
  const n = level==='leicht' ? 3 : level==='mittel' ? randInt(4,5) : randInt(5,6);
  const gs = genderMix(R, pool, n), taken=[];
  gs.forEach(g=>taken.push(pickWord(R,pool,g,taken)));
  endTask(R,taken);
  /* Karte und richtiger Rucksack dürfen nicht „direkt untereinander“ liegen, sonst merken sich Kinder nur die Position:
     Spalte der Karte im Tablett (i%3) und Zeile (i/3) dürfen höchstens selten mit der Position des richtigen Rucksacks übereinstimmen. */
  let order, bagArts, tries=0;
  do {
    order = shuffle(taken); bagArts = shuffle(['der','die','das']); tries++;
    var col=0,row=0; order.forEach((w,i)=>{ const b=bagArts.indexOf(w.definiteArticle); if(i%3===b) col++; if(Math.floor(i/3)===b) row++; });
  } while(tries<400 && (col>(order.length<=3?0:1) || row>1));
  const skins = shuffle(SKINS).slice(0,3);
  return { kind:'pack', set:'def', ids:order.map(w=>w.id), bags:bagArts.map((art,i)=>({art,skin:skins[i]})) };
}
function planMatch(R, level){
  const pool = poolFor(level);
  const n = level==='leicht' ? 3 : level==='mittel' ? 4 : 5;
  const set = (level!=='leicht' && Math.random()<0.4) ? 'indef' : 'def';
  let gs;
  if(set==='def') gs = genderMix(R,pool,n);
  else { const rem = remainingByGender(R,pool); const share = rem.f/Math.max(1,rem.f+rem.m+rem.n); const nf = Math.max(1,Math.min(n-1,Math.round(n*share+(Math.random()-.5)))); const mn=[]; for(let i=0;i<n-nf;i++){ const cm=mn.filter(x=>x==='m').length, cn=mn.length-cm; mn.push((rem.m-cm+Math.random()*1.5) >= (rem.n-cn+Math.random()*1.5) ? 'm' : 'n'); } gs = shuffle([...Array(nf).fill('f'), ...mn]); }
  const taken=[]; gs.forEach(g=>taken.push(pickWord(R,pool,g,taken)));
  endTask(R,taken);
  const tiles = shuffle(taken.map(w=>artOf(w,set)));
  const uniq=[...new Set(tiles)], sk=shuffle(SKINS), skinOf=Object.fromEntries(uniq.map((a,i)=>[a,sk[i%sk.length]]));
  return { kind:'match', set, ids:shuffle(taken).map(w=>w.id), tiles:tiles.map(art=>({art,skin:skinOf[art]})) };
}
function planMissing(R, level, g){
  const pool = poolFor(level);
  const set = (R.indefTasks<3 && Math.random()<0.4) ? 'indef' : 'def';
  let w;
  if(set==='indef'){ R.indefTasks++; const grp = chooseEinGroup(R); w = pickWord(R,pool,null,[],x=>!x.noIndef && (grp==='f' ? x.g==='f' : x.g!=='f')); noteEin(R,w); }
  else w = pickWord(R,pool,g,[]);
  endTask(R,[w]);
  const tpl = chooseTemplate(R,w);
  const arts = set==='indef' ? ['ein','eine'] : ['der','die','das'];
  return { kind:'missing', set, ids:[w.id], tpl, options:layoutOptions(R, arts, artOf(w,set)) };
}
function chooseEinGroup(R){ const c=R.einCount; if(c.f<c.mn) return 'f'; if(c.f>c.mn) return 'mn'; return pick(['f','mn']); }
function noteEin(R,w){ if(w.g==='f') R.einCount.f++; else { R.einCount.mn++; R.einCount[w.g]++; } }
function planEin(R, level){
  const pool = poolFor(level);
  const grp = chooseEinGroup(R);
  let g = null;
  if(grp==='f') g='f'; else g = R.einCount.m<=R.einCount.n ? 'm' : 'n';
  const w = pickWord(R,pool,g,[]);
  noteEin(R,w); endTask(R,[w]);
  return { kind:'ein', set:'indef', ids:[w.id], options:layoutOptions(R, ['ein','eine'], w.indefiniteArticle) };
}

/* ===== Aufgabenfolge ===== */
const MODE_KIND = { fork:'fork', pack:'pack', match:'match', missing:'missing', ein:'ein' };
function mixedKinds(level){
  const all = level==='leicht' ? ['fork','pack','match'] : ['fork','pack','match','missing','ein'];
  for(let tries=0;tries<500;tries++){
    let seq;
    if(level==='leicht'){
      seq = ['fork','fork','fork','pack','pack','match','match', pick(['fork','pack','match','ein'])];
    } else {
      seq = [...all, ...Array.from({length:3},()=>pick(all))];
    }
    seq = shuffle(seq);
    if(seq.every((k,i)=>i===0||k!==seq[i-1])) return seq;
  }
  return ['fork','pack','match','fork','pack','match','fork','pack'];
}
function makeRound(mode, level){
  const R = newRoundState();
  const kinds = mode==='mixed' ? mixedKinds(level) : Array(ROUND_TARGET).fill(MODE_KIND[mode]);
  // Genus-Reihenfolge für Einzelaufgaben (der/die/das): ausgewogen
  const singles = kinds.filter(k=>k==='fork'||k==='missing').length;
  const q = []; for(let i=0;i<Math.floor(singles/3);i++) q.push(...GENDERS);
  while(q.length<singles){ const rest = GENDERS.filter(g=>q.filter(x=>x===g).length < Math.ceil(singles/3)); q.push(pick(rest.length?rest:GENDERS)); }
  R.gq = shuffle(q);
  const tasks = kinds.map(k=>{
    if(k==='fork') return planFork(R,level,R.gq.pop());
    if(k==='pack') return planPack(R,level);
    if(k==='match') return planMatch(R,level);
    if(k==='missing') return planMissing(R,level,R.gq.pop());
    return planEin(R,level);
  });
  return { mode, level, tasks, repeats:R.repeats };
}
/* Lösung einer Aufgabe (nur für Tests/Prüfungen) */
function solutionOf(task){
  return task.ids.map(id=>{ const w=WORD_BY_ID[id]; return { id, art:artOf(w,task.set), phrase:phraseOf(w,task.set) }; });
}

function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

/* ---- Sprachausgabe (SpeechSynthesis, de-DE). Das Spiel funktioniert auch ohne. ---- */
let voices=[];
function loadVoices(){ try{ voices = window.speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
function speechOk(){ try{ return 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance!=='undefined' && !!window.speechSynthesis; }catch(e){ return false; } }
function soundActive(){ return state.sound && speechOk(); }
function mkUtter(text){ const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=.85; u.pitch=1; const v=voices.find(v=>/^de[-_]/i.test(v.lang)) || voices.find(v=>/^de/i.test(v.lang)); if(v) u.voice=v; return u; }
function say(text){ if(!soundActive()) return; try{ const s=window.speechSynthesis; s.cancel(); s.speak(mkUtter(text)); }catch(e){} }
function sayList(list){ if(!soundActive()) return; try{ const s=window.speechSynthesis; s.cancel(); list.forEach(t=>s.speak(mkUtter(t))); }catch(e){} }
function stopSay(){ try{ if(speechOk()) window.speechSynthesis.cancel(); }catch(e){} }
if(speechOk()){ loadVoices(); try{ window.speechSynthesis.addEventListener('voiceschanged',loadVoices); }catch(e){} }

/* ---- Karte (Fortschritt) ---- */
const MAP = { W:0, H:0, pts:[], legs:[], pos:0, raf:0 };
function buildMap(){
  const box=$('mapstrip'); const W=Math.max(200,box.clientWidth), H=Math.max(40,box.clientHeight);
  MAP.W=W; MAP.H=H;
  const padL=Math.max(26,H*.62), padR=Math.max(30,H*.7), n=ROUND_TARGET, amp=H*.17, mid=H*.5;
  MAP.pts = Array.from({length:n+1},(_,i)=>({ x: padL+(W-padL-padR)*i/n, y: i===0||i===n ? mid+H*.12 : mid+(i%2?-amp:amp) }));
  let legs='', dots='', deco='';
  MAP.legs=[];
  for(let i=1;i<=n;i++){
    const a=MAP.pts[i-1], b=MAP.pts[i], dx=b.x-a.x;
    legs += `<path class="leg" data-i="${i}" d="M${a.x.toFixed(1)},${a.y.toFixed(1)} C${(a.x+dx*.5).toFixed(1)},${a.y.toFixed(1)} ${(b.x-dx*.5).toFixed(1)},${b.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}" fill="none" stroke="#e4c88e" stroke-width="${(H*.2).toFixed(1)}" stroke-linecap="round"/>`;
  }
  let dash=''; for(let i=1;i<=n;i++){ const a=MAP.pts[i-1], b=MAP.pts[i], dx=b.x-a.x; dash += `<path d="M${a.x.toFixed(1)},${a.y.toFixed(1)} C${(a.x+dx*.5).toFixed(1)},${a.y.toFixed(1)} ${(b.x-dx*.5).toFixed(1)},${b.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}" fill="none" stroke="#a97a4d" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>`; }
  // Dekoration: Hügel, Bäume, Berg, Fluss
  deco += `<path d="M0,${H} L0,${H*.62} Q${W*.1},${H*.4} ${W*.22},${H*.62} T${W*.45},${H*.6} T${W*.7},${H*.64} T${W},${H*.55} V${H}Z" fill="#e8dcba" opacity=".8"/>`;
  const ts=H*.5; [[.16,.12],[.34,.78],[.58,.1],[.8,.8]].forEach(([fx,fy])=>{ deco += `<svg x="${(W*fx).toFixed(1)}" y="${(H*fy-ts*.5).toFixed(1)}" width="${ts.toFixed(1)}" height="${ts.toFixed(1)}" viewBox="0 0 100 100" opacity=".85">${SCENE_ART.baumchen}</svg>`; });
  const sz=H*.62;
  const camp=`<svg x="${(MAP.pts[0].x-sz*.5).toFixed(1)}" y="${(MAP.pts[0].y-sz*.8).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" viewBox="0 0 100 100">${ART.zelt}</svg>`;
  const cs=H*.8; const chest=`<svg x="${(MAP.pts[n].x-cs*.5).toFixed(1)}" y="${(MAP.pts[n].y-cs*.72).toFixed(1)}" width="${cs.toFixed(1)}" height="${cs.toFixed(1)}" viewBox="0 0 100 100">${ART.schatztruhe}</svg>`;
  for(let i=1;i<n;i++){ const p=MAP.pts[i], r=Math.min(H*.17,12); dots += `<g class="st" data-i="${i}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fffaf0" stroke="#b45e39" stroke-width="2.5"/><text x="${p.x.toFixed(1)}" y="${(p.y+r*.38).toFixed(1)}" text-anchor="middle" font-size="${(r*1.05).toFixed(1)}" font-weight="800" fill="#3a3226" font-family="Trebuchet MS,Segoe UI,sans-serif">${i}</text></g>`; }
  const ms=H*.7;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" focusable="false">${deco}${legs}${dash}${camp}${dots}${chest}<g id="mk" style="transform:translate(0px,0px)"><svg x="${(-ms*.5).toFixed(1)}" y="${(-ms*.88).toFixed(1)}" width="${ms.toFixed(1)}" height="${ms.toFixed(1)}" viewBox="0 0 100 100">${explorerSvgInner()}</svg></g></svg>`;
  MAP.legsEls=[...box.querySelectorAll('path.leg')];
  placeMarker(state.progress,false); markDone();
}
function markDone(){ document.querySelectorAll('#mapstrip .st').forEach(g=>{ const i=+g.dataset.i; const c=g.querySelector('circle'); c.setAttribute('fill', i<=state.progress ? '#eec14a' : '#fffaf0'); }); }
function prefersReduced(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function setMk(x,y){ const mk=$('mk'); if(mk) mk.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; }
function placeMarker(i,animate){
  cancelAnimationFrame(MAP.raf);
  const to=MAP.pts[i]; if(!to) return;
  if(!animate || i<=0 || prefersReduced()){ setMk(to.x,to.y); MAP.pos=i; return; }
  const leg=MAP.legsEls[i-1]; if(!leg){ setMk(to.x,to.y); return; }
  const len=leg.getTotalLength(), t0=performance.now(), dur=750;
  const step=now=>{ let t=Math.min(1,(now-t0)/dur); const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; const p=leg.getPointAtLength(len*e); setMk(p.x,p.y); if(t<1) MAP.raf=requestAnimationFrame(step); else { setMk(to.x,to.y); } };
  MAP.raf=requestAnimationFrame(step); MAP.pos=i;
}
function progressTo(n){ state.progress=n; placeMarker(n,true); markDone(); $('progress-live').textContent = n>=ROUND_TARGET ? 'Schatz erreicht!' : `Station ${n} von ${ROUND_TARGET}`; $('mapstrip').setAttribute('aria-label', n>=ROUND_TARGET ? 'Abenteuerkarte: Schatz erreicht' : `Abenteuerkarte: Station ${n} von ${ROUND_TARGET}`); }

/* ---- Spielablauf ---- */
function startGame(mode,level){
  clearTimers(); stopSay();
  state.mode=mode; state.level=level;
  const m=modeByKey(mode), L=LEVELS.find(l=>l.key===level);
  $('g-title').innerHTML = `${m.title}<small>${m.name} • ${L.label}</small>`;
  showScreen('game'); $('scenery').innerHTML=sceneryFor(mode);
  state.progress=0;
  buildMap();
  progressTo(0);
  startRound(false);
}
function startRound(){
  clearTimers(); stopSay();
  state.plan = makeRound(state.mode, state.level);
  state.idx=0; state.progress=0; markDone(); placeMarker(0,false);
  $('mapstrip').setAttribute('aria-label','Abenteuerkarte: Station 0 von '+ROUND_TARGET);
  showTask();
}
function showTask(){
  state.locked=false; state.wrong=0; clearTimers();
  const t=state.plan.tasks[state.idx]; state.task=t;
  renderTask(true);
}
function rerenderTask(){ renderTask(false); }
const RENDER = {};
function renderTask(fresh){
  const st=$('stage'); st.innerHTML=''; st.className='stage'; state.nextBtn=null;
  RENDER[state.task.kind](state.task, st, fresh);
  st.scrollTop=0;
  const first = st.querySelector('.opt,.pcard,.mcard');
  const a=document.activeElement; if(first && (a===document.body || !a)){ try{ first.focus({preventScroll:true}); }catch(e){} }
}
function showFb(msg,good){ const f=$('fb'); if(!f) return; f.textContent=msg; f.classList.toggle('good',!!good); f.classList.add('show'); }
function mkFb(){ const f=el('div','fb'); f.id='fb'; f.setAttribute('role','status'); f.setAttribute('aria-live','polite'); return f; }
function pane(cls){ return el('div','pane '+(cls||'')); }
function mkSpk(text, label){ const b=el('button','spk'); b.type='button'; b.setAttribute('aria-label',label||'Wort anhören'); b.innerHTML=SPEAKER.replace('class="slash"','class="slash" style="display:none"'); b.addEventListener('click',()=>say(text)); return b; }
function shake(e){ e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); after(450,()=>e.classList.remove('shake')); }
const comboHtml = (w,set) => `<span class="ln">${artOf(w,set).toUpperCase()} ${w.word.toUpperCase()}</span>`;

/* Aufgabe gelöst: Fortschritt, Weiter-Knopf, automatischer Übergang */
function solved(delayMs, host){
  state.locked=true; $('stage').classList.add('solved');
  const n = state.progress+1; progressTo(n);
  const last = n>=ROUND_TARGET;
  const nb = el('button','nextbtn', last ? 'Zum Schatz!' : 'Weiter'); nb.type='button'; nb.id='btn-next';
  nb.addEventListener('click',()=>advance());
  host.appendChild(nb); state.nextBtn=nb;
  try{ nb.focus({preventScroll:true}); }catch(e){}
  clearTimers(); state.advanceTimer = after(delayMs||3400, advance);
}
function advance(){
  clearTimers(); stopSay();
  if(state.progress>=ROUND_TARGET){ endRound(); return; }
  state.idx++; showTask();
}
function endRound(){
  clearTimers(); stopSay(); state.locked=true;
  $('end-art').innerHTML = END_SCENE();
  showScreen('end');
  const b=$('btn-again'); try{ b.focus({preventScroll:true}); }catch(e){}
  if(soundActive()) say('Abenteuer geschafft!');
}
function END_SCENE(){
  const g=(art,x,y,s,extra)=>`<g transform="translate(${x},${y}) scale(${s})"${extra||''}>${art}</g>`;
  const sp=(x,y,s)=>`<g class="sparkle">${g(SCENE_ART.funke,x,y,s)}</g>`;
  return `<svg viewBox="0 0 520 260" aria-hidden="true" focusable="false"><path d="M0,260 V170 Q70,120 150,172 T300,168 T450,160 T520,150 V260Z" fill="#e3ead6"/><path d="M0,260 V205 Q90,175 180,208 T360,204 T520,196 V260Z" fill="#d7e2c6"/>${g(ART.berg,10,40,1.6)}${g(SCENE_ART.baumchen,420,90,1.1)}${g(SCENE_ART.baumchen,456,114,.8)}${g(SCENE_ART.kammer,170,36,1.8)}${sp(150,34,.4)}${sp(340,24,.5)}${sp(378,98,.34)}${sp(120,110,.3)}${sp(260,10,.34)}<g class="hop">${g(explorerSvgInner(),60,120,1.05)}</g><g class="hop" style="animation-delay:.35s">${g(explorerSvgInner({hat:'#8fb9c9',hatD:'#5f8ea2',shirt:'#8fa888',shirtD:'#6f8a68',hair:'#3a3226',skin:'#d9a878'}),340,126,1.05)}</g></svg>`;
}

/* ================= Modus 1: Der, die oder das? (Weggabelung) ================= */
function wordVisible(){ return true; }  /* Wort steht immer da – auch wenn es gehört wird (Spielen ohne Ton) */
function buildOptions(t, onPick){
  const box=el('div','opts n'+t.options.length); box.setAttribute('role','group'); box.setAttribute('aria-label','Antworten');
  t.options.forEach(o=>{ const b=el('button','opt '+o.skin, o.art.toUpperCase()); b.type='button'; b.dataset.art=o.art; b.addEventListener('click',()=>onPick(b,o.art)); box.appendChild(b); });
  return box;
}
function pictureColumn(w, st, opts){
  const L=pane('pane-l');
  const pb=el('div','picbox'); pb.id='picbox';
  if(opts.hidePic){ pb.classList.add('blank'); pb.innerHTML=`<span class="bigword" style="font-weight:800;font-size:calc(var(--pic)*.2);text-align:center;overflow-wrap:anywhere;padding:0 6px">${w.word}</span>`; }
  else pb.innerHTML = artSvg(w.illustration);
  L.appendChild(pb);
  const row=el('div','picrow'); row.appendChild(mkSpk(w.word,'Wort anhören'));
  const tag=el('div','wordtag'); tag.id='wordtag'; if(opts.showWord && !opts.hidePic) tag.textContent=w.word; row.appendChild(tag);
  L.appendChild(row);
  st.appendChild(L);
  return L;
}
function revealPicture(w){ const pb=$('picbox'); if(!pb) return; pb.classList.remove('blank'); pb.innerHTML=artSvg(w.illustration); }
RENDER.fork = function(t, st, fresh){
  const w=WORD_BY_ID[t.ids[0]], correct=w.definiteArticle;
  pictureColumn(w, st, { showWord:wordVisible(), hidePic: state.level==='schwer' });
  const R=pane('pane-r');
  const p=el('p','prompt','Der, die oder das?'); R.appendChild(p);
  const box=buildOptions(t,(b,art)=>{
    if(state.locked) return;
    if(art===correct){
      box.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x!==b) x.classList.add('dim'); }); b.classList.add('good');
      revealPicture(w); const tag=$('wordtag'); if(tag) tag.textContent='';
      const c=$('combo'); c.innerHTML=comboHtml(w,'def'); c.classList.add('pop');
      showFb(pick(GOOD),true); say(phraseOf(w,'def'));
      solved(3600,R);
    } else { state.wrong++; shake(b); showFb(hintFor('fork'),false); if(state.wrong===1) say(w.word); }
  });
  R.appendChild(box);
  R.appendChild(mkFb()); const c=el('div','combo'); c.id='combo'; R.appendChild(c);
  st.appendChild(R);
  if(fresh) say(w.word);
};

/* ================= Modus 5: Ein oder eine? (Schatzkammer) ================= */
RENDER.ein = function(t, st, fresh){
  st.classList.add('k-sent');
  const w=WORD_BY_ID[t.ids[0]], correct=w.indefiniteArticle;
  if(state.level==='schwer'){
    const L=pane('pane-l');
    const d=el('div','defcard'); d.id='defcard';
    d.innerHTML=`<span>${w.definiteArticle.toUpperCase()} ${w.word.toUpperCase()}</span><span class="arr" aria-hidden="true">↓</span><span><span class="blank" id="einblank">&nbsp;&nbsp;&nbsp;</span> ${w.word.toUpperCase()}</span>`;
    L.appendChild(d);
    const row=el('div','picrow'); row.appendChild(mkSpk(w.word,'Wort anhören')); L.appendChild(row);
    st.appendChild(L);
  } else pictureColumn(w, st, { showWord:wordVisible(), hidePic:false });
  const R=pane('pane-r');
  R.appendChild(el('p','prompt','Ein oder eine?'));
  const box=buildOptions(t,(b,art)=>{
    if(state.locked) return;
    if(art===correct){
      box.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x!==b) x.classList.add('dim'); }); b.classList.add('good');
      const bl=$('einblank'); if(bl) bl.textContent=art.toUpperCase();
      const tag=$('wordtag'); if(tag) tag.textContent='';
      const c=$('combo'); if(state.level==='schwer'){ c.style.display='none'; const d=$('defcard'); d.querySelector('.blank').style.borderBottomColor='#3f7a3a'; } else c.innerHTML=`<span class="ln">${w.definiteArticle.toUpperCase()} ${w.word.toUpperCase()}</span><span class="arr" aria-hidden="true">↓</span><span class="ln">${w.indefiniteArticle.toUpperCase()} ${w.word.toUpperCase()}</span>`; c.classList.add('pop');
      showFb(pick(GOOD),true); say(phraseOf(w,'indef'));
      solved(3800,R);
    } else { state.wrong++; shake(b); showFb(hintFor('ein'),false); if(state.wrong===1) say(w.word); }
  });
  R.appendChild(box); R.appendChild(mkFb()); const c=el('div','combo'); c.id='combo'; R.appendChild(c);
  st.appendChild(R);
  if(fresh) say(w.word);
};

/* ================= Modus 4: Welcher Artikel fehlt? (Höhle) ================= */
RENDER.missing = function(t, st, fresh){
  st.classList.add('k-sent','k-missing');
  const w=WORD_BY_ID[t.ids[0]], correct=artOf(w,t.set);
  const L=pane('pane-l');
  const pb=el('div','picbox'+(state.level==='schwer'?' blank':'')); pb.id='picbox';
  pb.innerHTML = state.level==='schwer' ? artSvg('ruine') : artSvg(w.illustration);
  L.appendChild(pb);
  const row=el('div','picrow'); row.appendChild(mkSpk(w.word,'Wort anhören')); L.appendChild(row);
  st.appendChild(L);
  const R=pane('pane-r');
  R.appendChild(el('p','prompt', t.set==='indef' ? 'Ein oder eine – was fehlt?' : 'Der, die oder das – was fehlt?'));
  const s=el('p','sentence'); s.id='sentence';
  const pre = t.tpl.pre ? `${t.tpl.pre} ` : '';
  s.innerHTML = `${pre}<span class="gap" id="gap" aria-label="Lücke">&nbsp;</span> ${t.tpl.post}`;
  R.appendChild(s);
  const box=buildOptions(t,(b,art)=>{
    if(state.locked) return;
    if(art===correct){
      box.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x!==b) x.classList.add('dim'); }); b.classList.add('good');
      const g=$('gap'); g.textContent = t.tpl.pre ? art : cap(art); g.classList.add('filled');
      if(state.level==='schwer') revealPicture(w);
      const c=$('combo'); c.innerHTML=comboHtml(w,t.set); c.classList.add('pop');
      showFb(pick(GOOD),true); say(phraseOf(w,t.set));
      solved(4000,R);
    } else { state.wrong++; shake(b); showFb(hintFor('missing'),false); }
  });
  R.appendChild(box); R.appendChild(mkFb()); const c=el('div','combo'); c.id='combo'; R.appendChild(c);
  st.appendChild(R);
};

/* ================= Modus 2: Pack den Rucksack! (Entdeckercamp) ================= */
RENDER.pack = function(t, st, fresh){
  const words=t.ids.map(id=>WORD_BY_ID[id]);
  const showW = wordVisible();
  st.classList.add('k-pack');
  const L=el('div','blk a-tray pane-pack');
  L.appendChild(el('p','prompt','Pack den Rucksack!'));
  const tray=el('div','tray'); tray.id='tray'; tray.setAttribute('role','group'); tray.setAttribute('aria-label','Karten');
  const R=el('div','blk a-bags pane-pack'), F=el('div','blk a-foot');
  const bagsBox=el('div','bags'); bagsBox.setAttribute('role','group'); bagsBox.setAttribute('aria-label','Rucksäcke');
  let selected=null, placed=0;
  const bagEls={};
  t.bags.forEach(bg=>{
    const b=el('button','bag '+bg.skin); b.type='button'; b.dataset.art=bg.art; b.setAttribute('aria-label','Rucksack '+bg.art);
    b.innerHTML=`<span class="bag-lab">${bg.art.toUpperCase()}</span><span class="bag-in"></span>`;
    b.addEventListener('click',()=>{ if(selected) tryPlace(selected,b); });
    bagsBox.appendChild(b); bagEls[bg.art]=b;
  });
  function deselect(){ if(selected){ selected.classList.remove('sel'); selected.setAttribute('aria-pressed','false'); selected=null; } }
  function select(card){
    if(state.locked||card.classList.contains('placed')) return;
    if(selected===card){ deselect(); return; }
    deselect(); selected=card; card.classList.add('sel'); card.setAttribute('aria-pressed','true');
    say(WORD_BY_ID[card.dataset.id].word);
  }
  function tryPlace(card,bag){
    if(state.locked||card.classList.contains('placed')) return;
    const w=WORD_BY_ID[card.dataset.id];
    if(w.definiteArticle===bag.dataset.art){
      const mini=el('span','mini'); mini.dataset.id=w.id;
      mini.innerHTML=artSvg(w.illustration)+`<span class="t">${showW?w.word:''}</span>`;
      bag.querySelector('.bag-in').appendChild(mini);
      card.classList.add('placed'); card.disabled=true; card.style.visibility='hidden'; card.classList.remove('sel'); selected=null; placed++;
      if(placed===words.length) finish(); else showFb('Passt!',true);
    } else {
      state.wrong++; shake(bag); shake(card); deselect(); showFb(hintFor('pack'),false);
    }
  }
  function finish(){
    state.locked=true;
    // vollständige Kombinationen anzeigen (und nacheinander sprechen)
    const order=t.bags.map(b=>b.art);
    const list=[];
    order.forEach(art=>{ bagEls[art].querySelectorAll('.mini').forEach(m=>{ const w=WORD_BY_ID[m.dataset.id]; m.querySelector('.t').textContent=phraseOf(w,'def').toUpperCase(); list.push(phraseOf(w,'def')); }); });
    st.querySelectorAll('.bag').forEach(b=>b.disabled=true);
    showFb(pick(GOOD),true);
    sayList(list);
    state.locked=false; solved(2200+list.length*1300,F);
  }
  words.forEach(w=>{
    const c=el('button','pcard'); c.type='button'; c.dataset.id=w.id; c.setAttribute('aria-pressed','false');
    c.setAttribute('aria-label', w.word);
    c.innerHTML=artSvg(w.illustration)+`<span class="w">${showW?w.word:'&nbsp;'}</span>`;
    c.addEventListener('click',()=>{ if(c._dragged){ c._dragged=false; return; } select(c); });
    attachDrag(c, bag=>tryPlace(c,bag), ()=>select(c), ()=>state.locked||c.classList.contains('placed'), '.bag');
    tray.appendChild(c);
  });
  L.appendChild(tray); st.appendChild(L);
  R.appendChild(bagsBox); F.appendChild(mkFb());
  st.appendChild(R); st.appendChild(F);
};
/* Ziehen mit Maus/Finger (Zeiger-Ereignisse). Tippen-Alternative läuft über click. */
function attachDrag(card, onDrop, onStart, isBlocked, targetSel){
  let start=null, ghost=null, moved=false, over=null;
  card.addEventListener('pointerdown',e=>{
    if(isBlocked()) return; if(e.pointerType==='mouse' && e.button!==0) return;
    start={x:e.clientX,y:e.clientY,id:e.pointerId}; moved=false; card._dragged=false;
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
  });
  card.addEventListener('pointermove',e=>{
    if(!start||e.pointerId!==start.id) return;
    const dx=e.clientX-start.x, dy=e.clientY-start.y;
    if(!moved && Math.hypot(dx,dy)>8){
      moved=true; ghost=card.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel'); ghost.style.width=card.offsetWidth+'px'; ghost.removeAttribute('id'); document.body.appendChild(ghost); card.classList.add('drag-src'); onStart();
    }
    if(moved){
      ghost.style.left=(e.clientX-ghost.offsetWidth/2)+'px'; ghost.style.top=(e.clientY-ghost.offsetHeight/2)+'px';
      const under=document.elementFromPoint(e.clientX,e.clientY), tg=under&&under.closest?under.closest(targetSel):null;
      if(over&&over!==tg) over.classList.remove('over'); over=tg; if(tg) tg.classList.add('over');
    }
  });
  const end=e=>{
    if(!start||e.pointerId!==start.id) return;
    const wasMoved=moved; start=null; moved=false;
    if(ghost){ ghost.remove(); ghost=null; } card.classList.remove('drag-src'); if(over){ over.classList.remove('over'); over=null; }
    if(wasMoved){
      card._dragged=true; setTimeout(()=>{ card._dragged=false; },60);
      if(e.type==='pointerup'){ const under=document.elementFromPoint(e.clientX,e.clientY), tg=under&&under.closest?under.closest(targetSel):null; if(tg) onDrop(tg); else { card.classList.remove('sel'); card.setAttribute('aria-pressed','false'); } }
    }
  };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}

/* ================= Modus 3: Was gehört zusammen? (Alte Brücke) ================= */
RENDER.match = function(t, st, fresh){
  const words=t.ids.map(id=>WORD_BY_ID[id]);
  st.classList.add('k-match');
  const H=el('div','blk a-head'), C=el('div','blk a-cols'), F=el('div','blk a-foot'), P=H;
  H.appendChild(el('p','prompt', t.set==='indef' ? 'Ein oder eine – was gehört zusammen?' : 'Was gehört zusammen?'));
  const br=el('div','bridge'); br.setAttribute('aria-hidden','true'); words.forEach(()=>br.appendChild(el('span','plank'))); H.appendChild(br);
  const cols=el('div','mcols');
  const colL=el('div','mcol'), colR=el('div','mcol');
  let selCard=null, selTile=null, done=0;
  const lvl=state.level, showPic = lvl!=='schwer', showW = true;
  words.forEach(w=>{
    const c=el('button','mcard'); c.type='button'; c.dataset.id=w.id; c.setAttribute('aria-pressed','false');
    c.setAttribute('aria-label', w.word);
    c.innerHTML=(showPic?artSvg(w.illustration):'')+((showW||!showPic)?`<span class="w">${w.word}</span>`:'');
    c.addEventListener('click',()=>{ if(state.locked||c.classList.contains('done')) return; setSel('card',c); });
    colL.appendChild(c);
  });
  t.tiles.forEach((tl,i)=>{
    const b=el('button','tile '+tl.skin, tl.art.toUpperCase()); b.type='button'; b.dataset.art=tl.art; b.setAttribute('aria-pressed','false');
    b.addEventListener('click',()=>{ if(state.locked||b.classList.contains('used')) return; setSel('tile',b); });
    colR.appendChild(b);
  });
  function clearSel(){ if(selCard){ selCard.classList.remove('sel'); selCard.setAttribute('aria-pressed','false'); } if(selTile){ selTile.classList.remove('sel'); selTile.setAttribute('aria-pressed','false'); selTile.style.boxShadow=''; } selCard=selTile=null; }
  function setSel(kind,e){
    if(kind==='card'){ if(selCard===e){ clearSel(); return; } if(selCard) { selCard.classList.remove('sel'); selCard.setAttribute('aria-pressed','false'); } selCard=e; e.classList.add('sel'); e.setAttribute('aria-pressed','true'); say(WORD_BY_ID[e.dataset.id].word); }
    else { if(selTile===e){ clearSel(); return; } if(selTile){ selTile.classList.remove('sel'); selTile.setAttribute('aria-pressed','false'); selTile.style.boxShadow=''; } selTile=e; e.classList.add('sel'); e.setAttribute('aria-pressed','true'); e.style.boxShadow='0 0 0 5px rgba(31,95,122,.35)'; }
    if(selCard&&selTile) check();
  }
  function check(){
    const c=selCard, tl=selTile, w=WORD_BY_ID[c.dataset.id];
    if(artOf(w,t.set)===tl.dataset.art){
      c.classList.remove('sel'); c.classList.add('done'); c.disabled=true; c.setAttribute('aria-pressed','false');
      c.innerHTML=(showPic?artSvg(w.illustration):'')+`<span class="ph">${phraseOf(w,t.set).toUpperCase()}</span>`;
      tl.classList.remove('sel'); tl.style.boxShadow=''; tl.classList.add('used'); tl.disabled=true; tl.setAttribute('aria-pressed','false');
      selCard=selTile=null; done++;
      br.querySelectorAll('.plank')[done-1].classList.add('on');
      say(phraseOf(w,t.set));
      if(done===words.length){ showFb(pick(GOOD),true); solved(3200,F); } else showFb('Passt!',true);
    } else {
      state.wrong++; shake(c); shake(tl); clearSel(); showFb(hintFor('match'),false);
    }
  }
  cols.appendChild(colL); cols.appendChild(colR); C.appendChild(cols);
  F.appendChild(mkFb());
  st.appendChild(H); st.appendChild(C); st.appendChild(F);
};

/* ---- Navigation, Ende, Start ---- */
function backToMenu(){ clearTimers(); stopSay(); cancelAnimationFrame(MAP.raf); state.task=null; showScreen('start'); const f=document.querySelector('.mode-card'); if(f) f.focus({preventScroll:true}); }
function init(){
  buildBanner(); buildStart(); updateSoundButtons();
  $('btn-sound').addEventListener('click',toggleSound); $('btn-sound2').addEventListener('click',toggleSound);
  $('btn-back').addEventListener('click',backToMenu);
  $('sub-back').addEventListener('click',backToMenu);

  let rt=null; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(!$('screen-game').hidden) { buildMap(); } },120); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopSay(); });
  window.addEventListener('pagehide',stopSay);
  if(location.hash==='#qa'){ window.__aaDebug = { state, task:()=>state.task, plan:()=>state.plan, MAP, WORDS, makeRound, say }; }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
